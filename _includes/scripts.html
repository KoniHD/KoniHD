<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
  document.querySelectorAll("div.highlighter-rouge, figure.highlight").forEach((block) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy-code";
    button.title = "Copy code";
    button.setAttribute("aria-label", "Copy code");
    button.setAttribute("aria-live", "polite");
    button.innerHTML = '<i class="fa-solid fa-copy" aria-hidden="true"></i>';
    let resetTimer;
    button.addEventListener("click", async () => {
      await navigator.clipboard.writeText(block.querySelector("code").textContent);
      clearTimeout(resetTimer);
      button.classList.add("copied");
      button.title = "Copied";
      button.setAttribute("aria-label", "Copied");
      button.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i><span>Copied</span>';
      resetTimer = setTimeout(() => {
        button.classList.remove("copied");
        button.title = "Copy code";
        button.setAttribute("aria-label", "Copy code");
        button.innerHTML = '<i class="fa-solid fa-copy" aria-hidden="true"></i>';
      }, 1000);
    });
    block.appendChild(button);
  });
</script>
